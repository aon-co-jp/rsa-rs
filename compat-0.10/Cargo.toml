[package]
name = "rsa"
# `rsa` 0.10.0-rc.18 (ssh-key 0.7.0-rc.11 / russh が要求する版) と同じ版番号を名乗る。
# [patch.crates-io] で差し替えるためで、crates.io には公開しない。
version = "0.10.0-rc.18"
edition = "2021"
rust-version = "1.85"
description = "rsa 0.10 API-compatible subset on rsa-rs-core (avoids RUSTSEC-2023-0071)"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "rsa"

[features]
default = ["std", "encoding"]
encoding = ["dep:pkcs1", "dep:pkcs8", "dep:spki"]
std = ["pkcs1?/std", "pkcs8?/std"]
# 上流互換の feature 名 (未実装のものは空 = 機能なし)。
getrandom = []
hazmat = []
pkcs5 = ["pkcs8/encryption"]
serde = []
sha2 = ["dep:sha2"]

[dependencies]
rsa-rs-core = { path = "../core", default-features = false, features = ["os-rng"] }
const-oid = { version = "0.10", default-features = false }
crypto-bigint = { version = ">=0.7.10, <0.8", default-features = false, features = ["zeroize", "alloc"] }
digest = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
rand_core = { version = "0.10", default-features = false }
signature = { version = "3.0.0-rc.10", default-features = false, features = ["alloc", "digest", "rand_core"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
pkcs1 = { version = "0.8.0-rc.4", default-features = false, features = ["alloc", "pem"], optional = true }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc", "pem"], optional = true }
spki = { version = "0.8", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["oid"], optional = true }

[dev-dependencies]
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
hex = "0.4"
getrandom = "0.3"
digest = { version = "0.11", features = ["oid"] }
const-oid = "0.10"
